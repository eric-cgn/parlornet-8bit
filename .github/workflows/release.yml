# Every push to main: if VERSION names a version with no release yet, build the programs with
# tools/build.sh (cc65 in a Debian image pinned by digest), run the tests, tag the commit v<version>
# and publish a GitHub Release with the Apple IIe's self-booting disk (parlornet.dsk), the ProDOS files on a
# ProDOS volume (parlor-files.po), the Apple IIgs disk (parlornet-gs.po), and their SHA-256 and MD5 sums
# (SHA256SUMS, MD5SUMS, and in the release notes). A push that keeps the version does nothing.
# Run it by hand on main to release a version whose push did not run it.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time, so two quick landings can't both release the same version
concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - id: version
        name: A new version?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(cat VERSION)
          echo "VERSION=$v" >> "$GITHUB_ENV"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "ParlorNet for the Apple IIe, IIgs and C64 $v is already released"
            echo "new=no" >> "$GITHUB_OUTPUT"
          else
            echo "new=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Build
        if: steps.version.outputs.new == 'yes'
        run: tools/build.sh
      - name: Test
        if: steps.version.outputs.new == 'yes'
        run: python3 -m unittest discover test
      - name: Release files
        if: steps.version.outputs.new == 'yes'
        run: python3 tools/release.py
      - name: Release
        if: steps.version.outputs.new == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/notes.md"
          {
            echo "ParlorNet for the Apple IIe, IIgs and C64 $VERSION."
            echo
            echo "- parlornet.dsk is the Apple IIe's self-booting 140K disk, in DOS 3.3 sector order. It needs no ProDOS."
            echo "- parlor-files.po is a 140K ProDOS volume with PARLOR.SYSTEM and PARLOR.DAT. Copy them to a disk with your"
            echo "  own ProDOS. They fit on one 140K disk together with ProDOS."
            echo "- parlornet-gs.po is an 800K ProDOS volume with the Apple IIgs program, PARLORNET, and its PARLOR.DAT. It"
            echo "  runs under System 6.0.1 with Marinetti."
            echo "- parlornet.d64 is the Commodore 64's 1541 disk. LOAD\"*\",8,1 starts it, and a C128 boots it by itself."
            echo
            echo "The Apple IIe program draws in Double Hi-Res and needs 128K. That means a IIe with an extended"
            echo "80-column card, a IIc or a IIgs. Each file was built from this commit by tools/build.sh, and the README"
            echo "has the details."
            echo
            echo "SHA-256:"
            echo
            echo '```'
            cat build/release/SHA256SUMS
            echo '```'
            echo
            echo "MD5:"
            echo
            echo '```'
            cat build/release/MD5SUMS
            echo '```'
          } > "$notes"
          gh release create "v$VERSION" build/release/* --target "$GITHUB_SHA" --title "ParlorNet for the Apple IIe, IIgs and C64 $VERSION" --notes-file "$notes"
