# Every push to dev: a build and the tests, published as the "dev" pre-release on GitHub. Each build
# replaces the last one. Its files are named for the version in VERSION, "-dev-", and the commit, such as
# parlornet-1.0-dev-46a0304.dsk.
name: Dev build

on:
  push:
    branches: [dev]

# Only the newest build matters
concurrency:
  group: dev
  cancel-in-progress: true

jobs:
  dev:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Version
        run: |
          v=$(cat VERSION)-dev-$(git rev-parse --short=7 HEAD)
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build
        run: tools/build.sh
      - name: Install NuLib2
        run: sudo apt-get update -q && sudo apt-get install -y -q nulib2
      - name: Test
        run: python3 -m unittest discover test
      - name: Release files
        run: python3 tools/release.py
      - name: Dev files
        run: |
          mkdir dist
          for f in build/release/*; do
            b=$(basename "$f")
            case "$b" in SHA256SUMS|MD5SUMS) continue ;; esac
            cp "$f" "dist/${b%.*}-$VERSION.${b##*.}"
          done
          cd dist
          files=$(ls)
          sha256sum $files > SHA256SUMS
          md5sum $files > MD5SUMS
      - name: Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev --cleanup-tag --yes || true
          gh release create dev dist/* --prerelease --target "$GITHUB_SHA" --title "ParlorNet for the Apple IIe, IIgs and C64 $VERSION" \
            --notes "A build of the dev branch, not a release. It is replaced by every change to dev."
