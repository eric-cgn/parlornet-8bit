# ld65 configuration for PARLORNET's start (gsshell.s): position-independent code, linked at 0;
# tools/apple2gs.py puts the program after it, at the label payload.
MEMORY {
    SH: file = %O, start = $0000, size = $1000;
}
SEGMENTS {
    SHELL:   load = SH, type = ro;
    PAYLOAD: load = SH, type = ro;
}
