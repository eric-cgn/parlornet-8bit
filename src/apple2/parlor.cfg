# ld65 configuration for ParlorNet on the Apple IIe (no operating system; see boot.s).
#
#   $0200-$03CE  the Double Hi-Res kit's parameters (dhr.s; not on the disk)
#   $0800-$0DFF  the boot block and sector reader (boot.cfg)
#   $0E00-$14FF  the serial ring, the reply buffer and the lines of pages (not on the disk)
#   $1500-$1AFF  a table's move tokens and chat (table.c), or the lobby's lists (lobby.c)
#   $1C00-$1FFF  cc65's C stack
#   $2000-$3FFF  Double Hi-Res, its main half (the auxiliary memory has the other); at start-up the kit
#                (%O.dhr) is loaded at $2800, from where the program copies it into the auxiliary memory
#   $4000-$BFFF  the program (%O.main)
#   $D000-$DFFF  the command line, the dialogs and the pages of text (frame.c), in the language card's RAM,
#                bank 1
#   $D000-$FEFF  one overlay at a time, in the language card's RAM, bank 2: the sign-in or a game
#                (%O.<name>); build.sh adds a memory area and a segment for each at the marks
#   $FF00-$FFFF  the joystick (joy.s) and the 6502 vectors (%O.vec)
#
# In the auxiliary memory: the kit's copy of $0200-$03CE, places it keeps worked out at $0400-$05DF, the
# Double Hi-Res kit and the games' Double Hi-Res pictures at $0800-$1FFF (AUXK), the other half of Double
# Hi-Res, and the code, font and line tables the kit uses (MIRROR, font.s, hgr.s) at their own addresses.

SYMBOLS {
    __CSTACK_START__: type = export, value = $1C00;
    __CSTACK_SIZE__:  type = export, value = $0400;
}
MEMORY {
    ZP:     file = "", start = $0080, size = $0040, define = yes;
    PARM:   file = "", start = $0200, size = $01CF;
    LOW:    file = "", start = $0E00, size = $0700;
    MAIN:   file = "%O.main", start = $4000, size = $8000, define = yes;
    VEC:    file = "%O.vec",  start = $FF00, size = $0100, fill = yes;
    LISTS:  file = "", start = $1500, size = $0600;
    LISTSL: file = "", start = $1500, size = $0600;
    DHRSTAGE: file = "%O.dhr", start = $2800, size = $1800;
    AUXK:   file = "", start = $0800, size = $1800, define = yes;
#OVLMEM
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    DHRPARM:  load = PARM, type = bss;
    RING:     load = LOW,  type = bss, align = $100;
    REPLY:    load = LOW,  type = bss, align = $100;
    LOWBSS:   load = LOW,  type = bss;
    STARTUP:  load = MAIN, type = ro;
    ONCE:     load = MAIN, type = ro,  optional = yes;
    MIRROR:   load = MAIN, type = ro,  define = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
    TABLE:    load = LISTS, type = bss;
    LOBBY:    load = LISTSL, type = bss;
    DHRKIT:   load = DHRSTAGE, run = AUXK, type = rw, define = yes;
    AUXART:   load = DHRSTAGE, run = AUXK, type = ro, define = yes, optional = yes;
    JOYCODE:  load = VEC,  type = rw;
    VECTORS:  load = VEC,  type = ro,  start = $FFFA;
#OVLSEG
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
