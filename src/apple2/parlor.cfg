# ld65 configuration for ParlorNet on the Apple IIe (no operating system; see boot.s).
#
#   $0800-$0DFF  the boot block and sector reader (boot.cfg)
#   $0200-$03CE  the Double Hi-Res kit's parameters (dhr.s; not on the disk)
#   $0E00-$1FFF  the serial ring, the reply buffer and cc65's C stack (not on the disk)
#   $2000-$3FFF  Double Hi-Res, its main half (the auxiliary memory has the other)
#   $4000-$BFFF  the program (%O.main)
#   $D000-$DFFF  the Double Hi-Res kit (dhr.s, %O.dhr), in the language card's RAM, bank 1
#   $D000-$F8FF  one overlay at a time, in the language card's RAM, bank 2: the sign-in or a game
#                (%O.<name>); build.sh adds a memory area and a segment for each at the marks
#   $F900-$FEFF  a table's move tokens and chat (table.c), or the lobby's lists (lobby.c)
#   $FF00-$FFFF  the joystick (joy.s) and the 6502 vectors (%O.vec)

SYMBOLS {
    __CSTACK_START__: type = export, value = $1C00;
    __CSTACK_SIZE__:  type = export, value = $0400;
}
MEMORY {
    ZP:     file = "", start = $0080, size = $0040, define = yes;
    PARM:   file = "", start = $0200, size = $01CF;
    LOW:    file = "", start = $0E00, size = $0E00;
    MAIN:   file = "%O.main", start = $4000, size = $8000, define = yes;
    VEC:    file = "%O.vec",  start = $FF00, size = $0100, fill = yes;
    HIGH:   file = "", start = $F900, size = $0600;
    HIGHL:  file = "", start = $F900, size = $0600;
    DHRK:   file = "%O.dhr",  start = $D000, size = $1000;
#OVLMEM
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    DHRPARM:  load = PARM, type = bss;
    RING:     load = LOW,  type = bss, align = $100;
    LOWBSS:   load = LOW,  type = bss;
    STARTUP:  load = MAIN, type = ro;
    ONCE:     load = MAIN, type = ro,  optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
    TABLE:    load = HIGH, type = bss;
    LOBBY:    load = HIGHL, type = bss;
    DHRKIT:   load = DHRK, type = rw;
    JOYCODE:  load = VEC,  type = rw;
    VECTORS:  load = VEC,  type = ro,  start = $FFFA;
#OVLSEG
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
