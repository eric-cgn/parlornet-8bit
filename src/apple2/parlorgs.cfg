# ld65 configuration for ParlorNet on the Apple IIgs: the program in a 64K bank of its own (gs.s,
# gsshell.s), at the same addresses as on the IIe. The zero page is in the direct page GS/OS gives the
# application; there are no 6502 vectors.
#
#   $0800-$08FF  the overlay table and our user ID (written by tools/apple2gs.py and gsshell.s)
#   $0D00-$0DFF  a page of a file at a time (prodos.c)
#   $0E00-$14FF  the serial ring's place, the reply buffer and the lines of pages (not in the file)
#   $1500-$1AFF  a table's move tokens and chat (table.c), or the lobby's lists (lobby.c)
#   $1C00-$1FFF  cc65's C stack
#   $4000-$CFFF  the program (%O.main): in a bank of its own, $C000-$CFFF is memory like any other
#   $D000-$FEFF  one overlay at a time: the sign-in, the settings or a game, from PARLOR.DAT

SYMBOLS {
    __CSTACK_START__: type = export, value = $1C00;
    __CSTACK_SIZE__:  type = export, value = $0400;
}
MEMORY {
    ZP:     file = "", start = $0080, size = $0040, define = yes;
    LOW:    file = "", start = $0E00, size = $0700;
    MAIN:   file = "%O.main", start = $4000, size = $9000, define = yes;
    LISTS:  file = "", start = $1500, size = $0600;
    LISTSL: file = "", start = $1500, size = $0600;
#OVLMEM
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    RING:     load = LOW,  type = bss, align = $100, optional = yes;
    REPLY:    load = LOW,  type = bss, align = $100;
    LOWBSS:   load = LOW,  type = bss;
    STARTUP:  load = MAIN, type = ro;
    ONCE:     load = MAIN, type = ro,  optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    BSS:      load = MAIN, type = bss, define = yes;
    TABLE:    load = LISTS, type = bss;
    LOBBY:    load = LISTSL, type = bss;
#OVLSEG
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
