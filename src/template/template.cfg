# ld65 configuration for ParlorNet's template machine: a 6502 with 64K of RAM, laid out as the C64 is. A real
# machine sets this to its own memory map (see src/c64/parlor.cfg and src/apple2/parlor.cfg).
#
#   $0002-$008F  zero page
#   $0400-$07FF  the C stack
#   $0800-$14FF  the reply buffer (LOWBSS)
#   $1500-$89FF  the program (%O.main), then its BSS
#   $8A00-$8FFF  a table's move tokens and chat (table.c), or the lobby's lists (lobby.c)
#   $9000-$BFFF  one overlay at a time (%O.<name>); build.sh adds a memory area and a segment for each

SYMBOLS {
    __CSTACK_START__: type = export, value = $0400;
    __CSTACK_SIZE__:  type = export, value = $0400;
}
MEMORY {
    ZP:     file = "", start = $0002, size = $008E, define = yes;
    LOW:    file = "", start = $0800, size = $0D00;
    MAIN:   file = "%O.main", start = $1500, size = $7500, define = yes;
    HIGH:   file = "", start = $8A00, size = $0600;
    HIGHL:  file = "", start = $8A00, size = $0600;
#OVLMEM
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    LOWBSS:   load = LOW,   type = bss;
    STARTUP:  load = MAIN,  type = ro;
    ONCE:     load = MAIN,  type = ro,  optional = yes;
    CODE:     load = MAIN,  type = ro;
    RODATA:   load = MAIN,  type = ro;
    DATA:     load = MAIN,  type = rw;
    BSS:      load = MAIN,  type = bss, define = yes;
    TABLE:    load = HIGH,  type = bss;
    LOBBY:    load = HIGHL, type = bss;
#OVLSEG
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
