# ld65 configuration for the C64 cartridge's first bank (cart.s): its start at $8000, and the loader, kept in
# the bank after it and copied to $C800 (the text screen-to-be) to run. tools/c64_crt.py puts the directory at
# $8800 and the files from bank 1 on.
MEMORY {
    ROM: file = %O, start = $8000, size = $0800, fill = yes, fillval = $FF;
    RUN: file = "", start = $C800, size = $0400;
}
SEGMENTS {
    CART:   load = ROM, type = ro;
    LOADER: load = ROM, run = RUN, type = ro, define = yes;
}
