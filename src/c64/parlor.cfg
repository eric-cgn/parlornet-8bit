# ld65 configuration for ParlorNet on the Commodore 64 (c64.h has the whole memory map).
#
#   $0002-$008F  zero page
#   $0400-$05FF  the serial line's receive and send rings (serial.s)
#   $0600-$07FF  cc65's C stack
#   $0800-$14FF  the reply buffer (LOWBSS), where the loader was
#   $1500-       the program (%O.main): what starts it and runs the start screen, the settings and the
#                console, then its BSS, then the lobby and the tables (PCODE, PRODATA), which
#                tools/c64_disk.py cuts off into a file of their own, PN.PARLOR, loaded when first needed
#   @HIGH@-      a table's move tokens and chat (table.c), or the lobby's lists (lobby.c)
#   @OVL@-$BFFF  one overlay at a time (%O.<name>); build.sh adds a memory area and a segment for each at
#                the marks

SYMBOLS {
    __CSTACK_START__: type = export, value = $0600;
    __CSTACK_SIZE__:  type = export, value = $0200;
}
MEMORY {
    ZP:     file = "", start = $0002, size = $008E, define = yes;
    RINGS:  file = "", start = $0400, size = $0200;
    LOW:    file = "", start = $0800, size = $0D00;
    MAIN:   file = "%O.main", start = $1500, size = @MAINSIZE@, define = yes;
    HIGH:   file = "", start = @HIGH@, size = $0600;
    HIGHL:  file = "", start = @HIGH@, size = $0600;
#OVLMEM
}
SEGMENTS {
    ZEROPAGE: load = ZP,    type = zp;
    RING:     load = RINGS, type = bss, align = $100;
    TXRING:   load = RINGS, type = bss, align = $100;
    LOWBSS:   load = LOW,   type = bss;
    STARTUP:  load = MAIN,  type = ro;
    ONCE:     load = MAIN,  type = ro,  optional = yes;
    CODE:     load = MAIN,  type = ro;
    RODATA:   load = MAIN,  type = ro;
    DATA:     load = MAIN,  type = rw;
    BSS:      load = MAIN,  type = bss, define = yes;
    PCODE:    load = MAIN,  type = ro,  define = yes;
    PRODATA:  load = MAIN,  type = ro,  define = yes;
    TABLE:    load = HIGH,  type = bss;
    LOBBY:    load = HIGHL, type = bss;
#OVLSEG
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
